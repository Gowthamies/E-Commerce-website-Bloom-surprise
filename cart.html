<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container my-5 text-center">
    <h2>Your Cart 🛒</h2>

    <div class="card p-4 mt-4">

        <h5 id="productName"></h5>

        <div class="my-3">
            <input type="number" id="qty" value="1" min="1" class="form-control w-25 mx-auto">
        </div>

        <h4>Total: ₹<span id="total"></span></h4>

        <a href="order.html" class="btn btn-danger mt-3">Proceed to Checkout</a>

    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const name = params.get("name");
const price = parseInt(params.get("price"));

if(!name || !price){
    document.getElementById("productName").textContent = "No product selected";
} else {
    document.getElementById("productName").textContent = name + " - ₹" + price;
    document.getElementById("total").textContent = price;

    const qtyInput = document.getElementById("qty");
    qtyInput.addEventListener("input", function(){
        document.getElementById("total").textContent = price * qtyInput.value;
    });
}
</script>

</body>
</html>
